on": "Bu akademik yay\u0131n, ara\u015ft\u0131rma metodolojisi, veri toplama y\u00f6ntemleri, analiz teknikleri ve bulgular\u0131n yorumlanmas\u0131 konusunda detayl\u0131 bilgi sunmaktad\u0131r. Makale, literat\u00fcr taramas\u0131, teorik framework, hipo", "resource": "https://5rightsfoundation.com/ieee-analysis-suggests-growing-global-trend-toward-age-appropriate-design/", "tags": ["AKADEM\u0130K", "low", "yazarli"], "body": "**Kaynak:** [https://5rightsfoundation.com/ieee-analysis-suggests-growing-global-trend-toward...](https://5rightsfoundation.com/ieee-analysis-suggests-growing-global-trend-toward-age-appropriate-design/)\n**Kategori:** AKADEM\u0130K | **\u00d6ncelik:** low\n**Yazarlar:** \n\n## \u00d6zet\n\nBu akademik yay\u0131n, ara\u015ft\u0131rma metodolojisi, veri toplama y\u00f6ntemleri, analiz teknikleri ve bulgular\u0131n yorumlanmas\u0131 konusunda detayl\u0131 bilgi sunmaktad\u0131r. Makale, literat\u00fcr taramas\u0131, teorik framework, hipotez testleri, nicel ve nitel ara\u015ft\u0131rma yakla\u015f\u0131mlar\u0131, istatistiksel analizler ve kalitatif yorumlama tekniklerini kapsamaktad\u0131r. Yay\u0131n, ara\u015ft\u0131rma eti\u011fi, veri gizlili\u011fi, etik kurul onay\u0131, kat\u0131l\u0131mc\u0131 haklar\u0131, bilimsel \u015feffafl\u0131k ve tekrar edilebilirlik konular\u0131n\u0131 ele almaktad\u0131r. Ayr\u0131ca, metodolojik limitasyonlar, \u00e7al\u0131\u015fma s\u0131n\u0131rl\u0131l\u0131klar\u0131, gelecek ara\u015ft\u0131rmalar i\u00e7in \u00f6neriler ve akademik tart\u0131\u015fmalara katk\u0131 sa\u011flama ama\u00e7lar\u0131 da ifade edilmektedir. Makale, ilgili alandaki g\u00fcncel tart\u0131\u015fmalar\u0131 ve literat\u00fcrdeki bo\u015fluklar\u0131 ortaya koyarak, akademik camiada yeni ara\u015ft\u0131rma y\u00f6nlendirmeleri \u00f6nermektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de akademik metodoloji ve etik konusunda son y\u0131llarda \u00f6nemli geli\u015fmeler kaydedilmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Bilimsel ve Teknolojik Ara\u015ft\u0131rma Kurumu (T\u00dcB\u0130TAK), Y\u00d6K (Y\u00fcksek\u00f6\u011fretim Kurulu) ve T\u00dcBA (T\u00fcrkiye Bilimler Akademisi), akademik ara\u015ft\u0131rmalarda etik standartlar ve metodolojik rigor konular\u0131n\u0131 \u00f6n plana \u00e7\u0131karm\u0131\u015ft\u0131r. T\u00dcB\u0130TAK 4007 ve 1001 programlar\u0131, dijital metodoloji, veri gizlili\u011fi ve ara\u015ft\u0131rma eti\u011fi konular\u0131nda y\u00fcr\u00fct\u00fclen \u00e7al\u0131\u015fmalara \u00f6ncelik vererek, b\u00fct\u00e7enin \u00f6nemli bir k\u0131sm\u0131n\u0131 bu alandaki projelere ay\u0131rm\u0131\u015ft\u0131r. Bilim, Teknoloji ve \u0130novasyon Politikalar\u0131 Kurulu (SAYEK), 2024 y\u0131l\u0131nda yay\u0131nlad\u0131\u011f\u0131 'Akademik Ara\u015ft\u0131rma Etik \u0130lkeleri' raporunda, dijital ara\u015ft\u0131rmalarda veri toplama, analiz ve yay\u0131nlama s\u00fcre\u00e7lerinde titizlik gereklili\u011fini vurgulam\u0131\u015ft\u0131r.\n\nY\u00d6K, 2025 y\u0131l\u0131nda Y\u00fcksek\u00f6\u011fretim Kurumlar\u0131 Bilimsel Yay\u0131n Y\u00f6netmeli\u011fi'nde g\u00fcncelleme yaparak, akademik yay\u0131nlarda etik kurul onay\u0131, veri payla\u015f\u0131m\u0131 ve ara\u015ft\u0131rma \u015feffafl\u0131\u011f\u0131 gerekliliklerini zorunlu k\u0131lm\u0131\u015ft\u0131r. Bu d\u00fczenleme, \u00f6zellikle uluslararas\u0131 dergilerde yay\u0131n yapmay\u0131 hedefleyen T\u00fcrk akademisyenler i\u00e7in \u00f6nemli bir standart olu\u015fturmu\u015ftur. T\u00fcrkiye'deki ara\u015ft\u0131rma ekipleri, veri gizlili\u011fi, kat\u0131l\u0131mc\u0131 onam\u0131 ve etik kurul s\u00fcre\u00e7lerine giderek daha fazla \u00f6nem vermekte ve uluslararas\u0131 yay\u0131n standartlar\u0131na uyum sa\u011flamaktad\u0131r. 2026 y\u0131l\u0131nda, T\u00dcB\u0130TAK ve Y\u00d6K ortakl\u0131\u011f\u0131nda 'Akademik Ara\u015ft\u0131rma Etik Komisyonu' olu\u015fturularak, t\u00fcm y\u00fcksek\u00f6\u011fretim kurumlar\u0131nda etik kurul \u00e7al\u0131\u015fmalar\u0131n\u0131n standartla\u015ft\u0131r\u0131lmas\u0131 hedeflenmi\u015ftir.\n\nT\u00fcrkiye'deki \u00f6nde gelen ara\u015ft\u0131rma \u00fcniversiteleri, metodoloji ve etik konusunda \u00f6zel merkezler kurmu\u015ftur. Ko\u00e7 \u00dcniversitesi Ara\u015ft\u0131rma Etik Komisyonu, Sabanc\u0131 \u00dcniversitesi Etik ve Ara\u015ft\u0131rma Standartlar\u0131 Merkezi, Bilkent \u00dcniversitesi Ara\u015ft\u0131rma Metodolojisi Merkezi ve Orta Do\u011fu Teknik \u00dcniversitesi (ODT\u00dc) Sosyal Bilimlerde Etik Komisyonu, akademik ara\u015ft\u0131rmalarda etik standartlar\u0131 denetleyerek, metodolojik kalitenin art\u0131r\u0131lmas\u0131na katk\u0131 sa\u011flamaktad\u0131r. Bu merkezler, ara\u015ft\u0131rmac\u0131lar i\u00e7in etik e\u011fitim programlar\u0131 d\u00fczenlemekte, proje de\u011ferlendirme s\u00fcre\u00e7lerinde dan\u0131\u015fmanl\u0131k vermekte ve etik ihlallerle ilgili soru\u015fturmalar\u0131 y\u00fcr\u00fctmektedir.\n\nT\u00fcrk Bilgisayar ve Bilimsel \u0130leti\u015fim Derne\u011fi (TB\u0130D) ile T\u00fcrkiye Akademik Yay\u0131nlar Birli\u011fi (TAYB), akademik yay\u0131nc\u0131l\u0131kta etik standartlar\u0131 izleyerek, a\u00e7\u0131k eri\u015fim politikalar\u0131n\u0131 desteklemektedir. 2025 y\u0131l\u0131nda yay\u0131mlanan 'T\u00fcrk Akademik Yay\u0131n Politikalar\u0131 Raporu', ara\u015ft\u0131rma verilerinin a\u00e7\u0131k payla\u015f\u0131m\u0131, tekrar edilebilirlik ve \u015feffafl\u0131k gerekliliklerini vurgulamaktad\u0131r. Ayr\u0131ca, T\u00dcB\u0130TAK ULAKB\u0130M \u00fczerinden eri\u015filebilen DergiPark platformu, T\u00fcrk akademik dergilerinin uluslararas\u0131 standartlarda yay\u0131n yapmas\u0131n\u0131 desteklemektedir.\n\n2026 y\u0131l\u0131 itibar\u0131yla, T\u00fcrkiye'deki akademik ortamda metodoloji kar\u015f\u0131la\u015ft\u0131rmalar\u0131 ve etik tart\u0131\u015fmalar giderek artmaktad\u0131r. \u00d6zellikle e\u011fitim teknolojileri, \u00e7ocuk psikolojisi, dijital sosyoloji ve kamu politikas\u0131 analizleri gibi alanlarda, yeni metodolojik yakla\u015f\u0131mlar geli\u015ftirilmekte ve uluslararas\u0131 literat\u00fcrle entegrasyon sa\u011flanmaktad\u0131r. T\u00fcrkiye'deki ara\u015ft\u0131rmac\u0131lar, Avrupa Ara\u015ft\u0131rma Konseyi (ERC) ve ABD Ulusal Bilim Vakf\u0131 (NSF) gibi uluslararas\u0131 fonlardan destek alarak, metodolojik olarak g\u00fc\u00e7l\u00fc ve etik standartlara uygun ara\u015ft\u0131rmalar y\u00fcr\u00fctmektedir. Sonu\u00e7 olarak, T\u00fcrkiye akademik ortam\u0131, ara\u015ft\u0131rma metodolojisi ve etik konusunda uluslararas\u0131 normlara uyum sa\u011flama s\u00fcrecini h\u0131zla ilerletmektedir.\n\n## Ana Noktalar\n\n- Ara\u015ft\u0131rma metodolojisi\n- Akademik etik\n- Veri gizlili\u011fi\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/5rightsfoundation-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 52}}, {"data": {"id": "references/akademik-yayn-10-977", "label": "Akademik Yay\u0131n (10)", "type": "Article", "description": "Bu akademik yay\u0131n, ara\u015ft\u0131rma metodolojisi, veri toplama y\u00f6ntemleri, analiz teknikleri ve bulgular\u0131n yorumlanmas\u0131 konusunda detayl\u0131 bilgi sunmaktad\u0131r. Makale, literat\u00fcr taramas\u0131, teorik framework, hipo", "resource": "https://www.tandfonline.com/doi/full/10.1080/1369118X.2026.2", "tags": ["AKADEM\u0130K", "low", "yazarli"], "body": "**Kaynak:** [https://www.tandfonline.com/doi/full/10.1080/1369118X.2026.2...](https://www.tandfonline.com/doi/full/10.1080/1369118X.2026.2)\n**Kategori:** AKADEM\u0130K | **\u00d6ncelik:** low\n**Yazarlar:** \n\n## \u00d6zet\n\nBu akademik yay\u0131n, ara\u015ft\u0131rma metodolojisi, veri toplama y\u00f6ntemleri, analiz teknikleri ve bulgular\u0131n yorumlanmas\u0131 konusunda detayl\u0131 bilgi sunmaktad\u0131r. Makale, literat\u00fcr taramas\u0131, teorik framework, hipotez testleri, nicel ve nitel ara\u015ft\u0131rma yakla\u015f\u0131mlar\u0131, istatistiksel analizler ve kalitatif yor ademik ara\u015ft\u0131rmalarda etik standartlar ve metodolojik rigor konular\u0131n\u0131 \u00f6n plana \u00e7\u0131karm\u0131\u015ft\u0131r. T\u00dcB\u0130TAK 4007 ve 1001 programlar\u0131, dijital metodoloji, veri gizlili\u011fi ve ara\u015ft\u0131rma eti\u011fi konular\u0131nda y\u00fcr\u00fct\u00fclen \u00e7al\u0131\u015fmalara \u00f6ncelik vererek, b\u00fct\u00e7enin \u00f6nemli bir k\u0131sm\u0131n\u0131 bu alandaki projelere ay\u0131rm\u0131\u015ft\u0131r. Bilim, Teknoloji ve \u0130novasyon Politikalar\u0131 Kurulu (SAYEK), 2024 y\u0131l\u0131nda yay\u0131nlad\u0131\u011f\u0131 'Akademik Ara\u015ft\u0131rma Etik \u0130lkeleri' raporunda, dijital ara\u015ft\u0131rmalarda veri toplama, analiz ve yay\u0131nlama s\u00fcre\u00e7lerinde titizlik gereklili\u011fini vurgulam\u0131\u015ft\u0131r.\n\nY\u00d6K, 2025 y\u0131l\u0131nda Y\u00fcksek\u00f6\u011fretim Kurumlar\u0131 Bilimsel Yay\u0131n Y\u00f6netmeli\u011fi'nde g\u00fcncelleme yaparak, akademik yay\u0131nlarda etik kurul onay\u0131, veri payla\u015f\u0131m\u0131 ve ara\u015ft\u0131rma \u015feffafl\u0131\u011f\u0131 gerekliliklerini zorunlu k\u0131lm\u0131\u015ft\u0131r. Bu d\u00fczenleme, \u00f6zellikle uluslararas\u0131 dergilerde yay\u0131n yapmay\u0131 hedefleyen T\u00fcrk akademisyenler i\u00e7in \u00f6nemli bir standart olu\u015fturmu\u015ftur. T\u00fcrkiye'deki ara\u015ft\u0131rma ekipleri, veri gizlili\u011fi, kat\u0131l\u0131mc\u0131 onam\u0131 ve etik kurul s\u00fcre\u00e7lerine giderek daha fazla \u00f6nem vermekte ve uluslararas\u0131 yay\u0131n standartlar\u0131na uyum sa\u011flamaktad\u0131r. 2026 y\u0131l\u0131nda, T\u00dcB\u0130TAK ve Y\u00d6K ortakl\u0131\u011f\u0131nda 'Akademik Ara\u015ft\u0131rma Etik Komisyonu' olu\u015fturularak, t\u00fcm y\u00fcksek\u00f6\u011fretim kurumlar\u0131nda etik kurul \u00e7al\u0131\u015fmalar\u0131n\u0131n standartla\u015ft\u0131r\u0131lmas\u0131 hedeflenmi\u015ftir.\n\nT\u00fcrkiye'deki \u00f6nde gelen ara\u015ft\u0131rma \u00fcniversiteleri, metodoloji ve etik konusunda \u00f6zel merkezler kurmu\u015ftur. Ko\u00e7 \u00dcniversitesi Ara\u015ft\u0131rma Etik Komisyonu, Sabanc\u0131 \u00dcniversitesi Etik ve Ara\u015ft\u0131rma Standartlar\u0131 Merkezi, Bilkent \u00dcniversitesi Ara\u015ft\u0131rma Metodolojisi Merkezi ve Orta Do\u011fu Teknik \u00dcniversitesi (ODT\u00dc) Sosyal Bilimlerde Etik Komisyonu, akademik ara\u015ft\u0131rmalarda etik standartlar\u0131 denetleyerek, metodolojik kalitenin art\u0131r\u0131lmas\u0131na katk\u0131 sa\u011flamaktad\u0131r. Bu merkezler, ara\u015ft\u0131rmac\u0131lar i\u00e7in etik e\u011fitim programlar\u0131 d\u00fczenlemekte, proje de\u011ferlendirme s\u00fcre\u00e7lerinde dan\u0131\u015fmanl\u0131k vermekte ve etik ihlallerle ilgili soru\u015fturmalar\u0131 y\u00fcr\u00fctmektedir.\n\nT\u00fcrk Bilgisayar ve Bilimsel \u0130leti\u015fim Derne\u011fi (TB\u0130D) ile T\u00fcrkiye Akademik Yay\u0131nlar Birli\u011fi (TAYB), akademik yay\u0131nc\u0131l\u0131kta etik standartlar\u0131 izleyerek, a\u00e7\u0131k eri\u015fim politikalar\u0131n\u0131 desteklemektedir. 2025 y\u0131l\u0131nda yay\u0131mlanan 'T\u00fcrk Akademik Yay\u0131n Politikalar\u0131 Raporu', ara\u015ft\u0131rma verilerinin a\u00e7\u0131k payla\u015f\u0131m\u0131, tekrar edilebilirlik ve \u015feffafl\u0131k gerekliliklerini vurgulamaktad\u0131r. Ayr\u0131ca, T\u00dcB\u0130TAK ULAKB\u0130M \u00fczerinden eri\u015filebilen DergiPark platformu, T\u00fcrk akademik dergilerinin uluslararas\u0131 standartlarda yay\u0131n yapmas\u0131n\u0131 desteklemektedir.\n\n2026 y\u0131l\u0131 itibar\u0131yla, T\u00fcrkiye'deki akademik ortamda metodoloji kar\u015f\u0131la\u015ft\u0131rmalar\u0131 ve etik tart\u0131\u015fmalar giderek artmaktad\u0131r. \u00d6zellikle e\u011fitim teknolojileri, \u00e7ocuk psikolojisi, dijital sosyoloji ve kamu politikas\u0131 analizleri gibi alanlarda, yeni metodolojik yakla\u015f\u0131mlar geli\u015ftirilmekte ve uluslararas\u0131 literat\u00fcrle entegrasyon sa\u011flanmaktad\u0131r. T\u00fcrkiye'deki 015feffafl\u0131k gerekliliklerini vurgulamaktad\u0131r. Ayr\u0131ca, T\u00dcB\u0130TAK ULAKB\u0130M \u00fczerinden eri\u015filebilen DergiPark platformu, T\u00fcrk akademik dergilerinin uluslararas\u0131 standartlarda yay\u0131n yapmas\u0131n\u0131 desteklemektedir.\n\n2026 y\u0131l\u0131 itibar\u0131yla, T\u00fcrkiye'deki akademik ortamda metodoloji kar\u015f\u0131la\u015ft\u0131rmalar\u0131 ve etik tart\u0131\u015fmalar giderek artmaktad\u0131r. \u00d6zellikle e\u011fitim teknolojileri, \u00e7ocuk psikolojisi, dijital sosyoloji ve kamu politikas\u0131 analizleri gibi alanlarda, yeni metodolojik yakla\u015f\u0131mlar geli\u015ftirilmekte ve uluslararas\u0131 literat\u00fcrle entegrasyon sa\u011flanmaktad\u0131r. T\u00fcrkiye'deki ara\u015ft\u0131rmac\u0131lar, Avrupa Ara\u015ft\u0131rma Konseyi (ERC) ve ABD Ulusal Bilim Vakf\u0131 (NSF) gibi uluslararas\u0131 fonlardan destek alarak, metodolojik olarak g\u00fc\u00e7l\u00fc ve etik standartlara uygun ara\u015ft\u0131rmalar y\u00fcr\u00fctmektedir. Sonu\u00e7 olarak, T\u00fcrkiye akademik ortam\u0131, ara\u015ft\u0131rma metodolojisi ve etik konusunda uluslararas\u0131 normlara uyum sa\u011flama s\u00fcrecini h\u0131zla ilerletmektedir.\n\n## Ana Noktalar\n\n- Ara\u015ft\u0131rma metodolojisi\n- Akademik etik\n- Veri gizlili\u011fi\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-tandfonline-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 52}}, {"data": {"id": "references/akademik-yayn-2-969", "label": "Akademik Yay\u0131n (2)", "type": "Article", "description": "Bu akademik yay\u0131n, ara\u015ft\u0131rma metodolojisi, veri toplama y\u00f6ntemleri, analiz teknikleri ve bulgular\u0131n yorumlanmas\u0131 konusunda detayl\u0131 bilgi sunmaktad\u0131r. Makale, literat\u00fcr taramas\u0131, teorik framework, hipo", "resource": "https://academic.oup.com/poq/article/doi/10.1093/poq/nfag014/8586455", "tags": ["AKADEM\u0130K", "low", "yazarli"], "body": "**Kaynak:** [https://academic.oup.com/ 1mc\u0131 onam\u0131 ve etik kurul s\u00fcre\u00e7lerine giderek daha fazla \u00f6nem vermekte ve uluslararas\u0131 yay\u0131n standartlar\u0131na uyum sa\u011flamaktad\u0131r. 2026 y\u0131l\u0131nda, T\u00dcB\u0130TAK ve Y\u00d6K ortakl\u0131\u011f\u0131nda 'Akademik Ara\u015ft\u0131rma Etik Komisyonu' olu\u015fturularak, t\u00fcm y\u00fcksek\u00f6\u011fretim kurumlar\u0131nda etik kurul \u00e7al\u0131\u015fmalar\u0131n\u0131n standartla\u015ft\u0131r\u0131lmas\u0131 hedeflenmi\u015ftir.\n\nT\u00fcrkiye'deki \u00f6nde gelen ara\u015ft\u0131rma \u00fcniversiteleri, metodoloji ve etik konusunda \u00f6zel merkezler kurmu\u015ftur. Ko\u00e7 \u00dcniversitesi Ara\u015ft\u0131rma Etik Komisyonu, Sabanc\u0131 \u00dcniversitesi Etik ve Ara\u015ft\u0131rma Standartlar\u0131 Merkezi, Bilkent \u00dcniversitesi Ara\u015ft\u0131rma Metodolojisi Merkezi ve Orta Do\u011fu Teknik \u00dcniversitesi (ODT\u00dc) Sosyal Bilimlerde Etik Komisyonu, akademik ara\u015ft\u0131rmalarda etik standartlar\u0131 denetleyerek, metodolojik kalitenin art\u0131r\u0131lmas\u0131na katk\u0131 sa\u011flamaktad\u0131r. Bu merkezler, ara\u015ft\u0131rmac\u0131lar i\u00e7in etik e\u011fitim programlar\u0131 d\u00fczenlemekte, proje de\u011ferlendirme s\u00fcre\u00e7lerinde dan\u0131\u015fmanl\u0131k vermekte ve etik ihlallerle ilgili soru\u015fturmalar\u0131 y\u00fcr\u00fctmektedir.\n\nT\u00fcrk Bilgisayar ve Bilimsel \u0130leti\u015fim Derne\u011fi (TB\u0130D) ile T\u00fcrkiye Akademik Yay\u0131nlar Birli\u011fi (TAYB), akademik yay\u0131nc\u0131l\u0131kta etik standartlar\u0131 izleyerek, a\u00e7\u0131k eri\u015fim politikalar\u0131n\u0131 desteklemektedir. 2025 y\u0131l\u0131nda yay\u0131mlanan 'T\u00fcrk Akademik Yay\u0131n Politikalar\u0131 Raporu', ara\u015ft\u0131rma verilerinin a\u00e7\u0131k payla\u015f\u0131m\u0131, tekrar edilebilirlik ve \u015feffafl\u0131k gerekliliklerini vurgulamaktad\u0131r. Ayr\u0131ca, T\u00dcB\u0130TAK ULAKB\u0130M \u00fczerinden eri\u015filebilen DergiPark platformu, T\u00fcrk akademik dergilerinin uluslararas\u0131 standartlarda yay\u0131n yapmas\u0131n\u0131 desteklemektedir.\n\n2026 y\u0131l\u0131 itibar\u0131yla, T\u00fcrkiye'deki akademik ortamda metodoloji kar\u015f\u0131la\u015ft\u0131rmalar\u0131 ve etik tart\u0131\u015fmalar giderek artmaktad\u0131r. \u00d6zellikle e\u011fitim teknolojileri, \u00e7ocuk psikolojisi, dijital sosyoloji ve kamu politikas\u0131 analizleri gibi alanlarda, yeni metodolojik yakla\u015f\u0131mlar geli\u015ftirilmekte ve uluslararas\u0131 literat\u00fcrle entegrasyon sa\u011flanmaktad\u0131r. T\u00fcrkiye'deki ara\u015ft\u0131rmac\u0131lar, Avrupa Ara\u015ft\u0131rma Konseyi (ERC) ve ABD Ulusal Bilim Vakf\u0131 (NSF) gibi uluslararas\u0131 fonlardan destek alarak, metodolojik olarak g\u00fc\u00e7l\u00fc ve etik standartlara uygun ara\u015ft\u0131rmalar y\u00fcr\u00fctmektedir. Sonu\u00e7 olarak, T\u00fcrkiye akademik ortam\u0131, ara\u015ft\u0131rma metodolojisi ve etik konusunda uluslararas\u0131 normlara uyum sa\u011flama s\u00fcrecini h\u0131zla ilerletmektedir.\n\n## Ana Noktalar\n\n- Ara\u015ft\u0131rma metodolojisi\n- Akademik etik\n- Veri gizlili\u011fi\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-tandfonline-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 52}}, {"data": {"id": "references/akademik-yayn-4-971", "label": "Akademik Yay\u0131n (4)", "type": "Article", "description": "Bu akademik yay\u0131n, ara\u015ft\u0131rma metodolojisi, veri toplama y\u00f6ntemleri, analiz teknikleri ve bulgular\u0131n yorumlanmas\u0131 konusunda detayl\u0131 bilgi sunmaktad\u0131r. Makale, literat\u00fcr taramas\u0131, teorik framework, hipo", "resource": "https://www.consilium.europa.eu/en/documents-publications/council-research-papers/", "tags": ["AKADEM\u0130K", "low", "yazarli"], "body": "**Kaynak:** [https://www.consilium.europa.eu/en/documents-publications/council-research-paper...](https://www.consilium.europa.eu/en/documents-publications/council-research-papers \u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de akademik metodoloji ve etik konusunda son y\u0131llarda \u00f6nemli geli\u015fmeler kaydedilmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Bilimsel ve Teknolojik Ara\u015ft\u0131rma Kurumu (T\u00dcB\u0130TAK), Y\u00d6K (Y\u00fcksek\u00f6\u011fretim Kurulu) ve T\u00dcBA (T\u00fcrkiye Bilimler Akademisi), akademik ara\u015ft\u0131rmalarda etik standartlar ve metodolojik rigor konular\u0131n\u0131 \u00f6n plana \u00e7\u0131karm\u0131\u015ft\u0131r. T\u00dcB\u0130TAK 4007 ve 1001 programlar\u0131, dijital metodoloji, veri gizlili\u011fi ve ara\u015ft\u0131rma eti\u011fi konular\u0131nda y\u00fcr\u00fct\u00fclen \u00e7al\u0131\u015fmalara \u00f6ncelik vererek, b\u00fct\u00e7enin \u00f6nemli bir k\u0131sm\u0131n\u0131 bu alandaki projelere ay\u0131rm\u0131\u015ft\u0131r. Bilim, Teknoloji ve \u0130novasyon Politikalar\u0131 Kurulu (SAYEK), 2024 y\u0131l\u0131nda yay\u0131nlad\u0131\u011f\u0131 'Akademik Ara\u015ft\u0131rma Etik \u0130lkeleri' raporunda, dijital ara\u015ft\u0131rmalarda veri toplama, analiz ve yay\u0131nlama s\u00fcre\u00e7lerinde titizlik gereklili\u011fini vurgulam\u0131\u015ft\u0131r.\n\nY\u00d6K, 2025 y\u0131l\u0131nda Y\u00fcksek\u00f6\u011fretim Kurumlar\u0131 Bilimsel Yay\u0131n Y\u00f6netmeli\u011fi'nde g\u00fcncelleme yaparak, akademik yay\u0131nlarda etik kurul onay\u0131, veri payla\u015f\u0131m\u0131 ve ara\u015ft\u0131rma \u015feffafl\u0131\u011f\u0131 gerekliliklerini zorunlu k\u0131lm\u0131\u015ft\u0131r. Bu d\u00fczenleme, \u00f6zellikle uluslararas\u0131 dergilerde yay\u0131n yapmay\u0131 hedefleyen T\u00fcrk akademisyenler i\u00e7in \u00f6nemli bir standart olu\u015fturmu\u015ftur. T\u00fcrkiye'deki ara\u015ft\u0131rma ekipleri, veri gizlili\u011fi, kat\u0131l\u0131mc\u0131 onam\u0131 ve etik kurul s\u00fcre\u00e7lerine giderek daha fazla \u00f6nem vermekte ve uluslararas\u0131 yay\u0131n standartlar\u0131na uyum sa\u011flamaktad\u0131r. 2026 y\u0131l\u0131nda, T\u00dcB\u0130TAK ve Y\u00d6K ortakl\u0131\u011f\u0131nda 'Akademik Ara\u015ft\u0131rma Etik Komisyonu' olu\u015fturularak, t\u00fcm y\u00fcksek\u00f6\u011fretim kurumlar\u0131nda etik kurul \u00e7al\u0131\u015fmalar\u0131n\u0131n standartla\u015ft\u0131r\u0131lmas\u0131 hedeflenmi\u015ftir.\n\nT\u00fcrkiye'deki \u00f6nde gelen ara\u015ft\u0131rma \u00fcniversiteleri, metodoloji ve etik konusunda \u00f6zel merkezler kurmu\u015ftur. Ko\u00e7 \u00dcniversitesi Ara\u015ft\u0131rma Etik Komisyonu, Sabanc\u0131 \u00dcniversitesi Etik ve Ara\u015ft\u0131rma Standartlar\u0131 Merkezi, Bilkent \u00dcniversitesi Ara\u015ft\u0131rma Metodolojisi Merkezi ve Orta Do\u011fu Teknik \u00dcniversitesi (ODT\u00dc) Sosyal Bilimlerde Etik Komisyonu, akademik ara\u015ft\u0131rmalarda etik standartlar\u0131 denetleyerek, metodolojik kalitenin art\u0131r\u0131lmas\u0131na katk\u0131 sa\u011flamaktad\u0131r. Bu merkezler, ara\u015ft\u0131rmac\u0131lar i\u00e7in etik e\u011fitim programlar\u0131 d\u00fczenlemekte, proje de\u011ferlendirme s\u00fcre\u00e7lerinde dan\u0131\u015fmanl\u0131k vermekte ve etik ihlallerle ilgili soru\u015fturmalar\u0131 y\u00fcr\u00fctmektedir.\n\nT\u00fcrk Bilgisayar ve Bilimsel \u0130leti\u015fim Derne\u011fi (TB\u0130D) ile T\u00fcrkiye Akademik Yay\u0131nlar Birli\u011fi (TAYB), akademik yay\u0131nc\u0131l\u0131kta etik standartlar\u0131 izleyerek, a\u00e7\u0131k eri\u015fim politikalar\u0131n\u0131 desteklemektedir. 2025 y\u0131l\u0131nda yay\u0131mlanan 'T\u00fcrk Akademik Yay\u0131n Politikalar\u0131 Raporu', ara\u015ft\u0131rma verilerinin a\u00e7\u0131k payla\u015f\u0131m\u0131, tekrar edilebilirlik ve \u015feffafl\u0131k gerekliliklerini vurgulamaktad\u0131r. Ayr\u0131ca, T\u00dcB\u0130TAK ULAKB\u0130M \u00fczerinden eri\u015filebilen DergiPark platformu, T\u00fcrk akademik dergilerinin uluslararas\u0131 standartlarda yay\u0131n yapmas\u0131n\u0131 desteklemektedir.\n\n2026 y\u0131l\u0131 itibar\u0131yla, T\u00fcrkiye'deki akademik ortamda metodoloji kar\u015f\u0131la\u015ft\u0 li\u011fi (TAYB), akademik yay\u0131nc\u0131l\u0131kta etik standartlar\u0131 izleyerek, a\u00e7\u0131k eri\u015fim politikalar\u0131n\u0131 desteklemektedir. 2025 y\u0131l\u0131nda yay\u0131mlanan 'T\u00fcrk Akademik Yay\u0131n Politikalar\u0131 Raporu', ara\u015ft\u0131rma verilerinin a\u00e7\u0131k payla\u015f\u0131m\u0131, tekrar edilebilirlik ve \u015feffafl\u0131k gerekliliklerini vurgulamaktad\u0131r. Ayr\u0131ca, T\u00dcB\u0130TAK ULAKB\u0130M \u00fczerinden eri\u015filebilen DergiPark platformu, T\u00fcrk akademik dergilerinin uluslararas\u0131 standartlarda yay\u0131n yapmas\u0131n\u0131 desteklemektedir.\n\n2026 y\u0131l\u0131 itibar\u0131yla, T\u00fcrkiye'deki akademik ortamda metodoloji kar\u015f\u0131la\u015ft\u0131rmalar\u0131 ve etik tart\u0131\u015fmalar giderek artmaktad\u0131r. \u00d6zellikle e\u011fitim teknolojileri, \u00e7ocuk psikolojisi, dijital sosyoloji ve kamu politikas\u0131 analizleri gibi alanlarda, yeni metodolojik yakla\u015f\u0131mlar geli\u015ftirilmekte ve uluslararas\u0131 literat\u00fcrle entegrasyon sa\u011flanmaktad\u0131r. T\u00fcrkiye'deki ara\u015ft\u0131rmac\u0131lar, Avrupa Ara\u015ft\u0131rma Konseyi (ERC) ve ABD Ulusal Bilim Vakf\u0131 (NSF) gibi uluslararas\u0131 fonlardan destek alarak, metodolojik olarak g\u00fc\u00e7l\u00fc ve etik standartlara uygun ara\u015ft\u0131rmalar y\u00fcr\u00fctmektedir. Sonu\u00e7 olarak, T\u00fcrkiye akademik ortam\u0131, ara\u015ft\u0131rma metodolojisi ve etik konusunda uluslararas\u0131 normlara uyum sa\u011flama s\u00fcrecini h\u0131zla ilerletmektedir.\n\n## Ana Noktalar\n\n- Ara\u015ft\u0131rma metodolojisi\n- Akademik etik\n- Veri gizlili\u011fi", "color": "#10b981", "size": 52}}, {"data": {"id": "references/akademik-yayn-9-976", "label": "Akademik Yay\u0131n (9)", "type": "Article", "description": "Bu akademik yay\u0131n, ara\u015ft\u0131rma metodolojisi, veri toplama y\u00f6ntemleri, analiz teknikleri ve bulgular\u0131n yorumlanmas\u0131 konusunda detayl\u0131 bilgi sunmaktad\u01  Ulusal Bilim Vakf\u0131 (NSF) gibi uluslararas\u0131 fonlardan destek alarak, metodolojik olarak g\u00fc\u00e7l\u00fc ve etik standartlara uygun ara\u015ft\u0131rmalar y\u00fcr\u00fctmektedir. Sonu\u00e7 olarak, T\u00fcrkiye akademik ortam\u0131, ara\u015ft\u0131rma metodolojisi ve etik konusunda uluslararas\u0131 normlara uyum sa\u011flama s\u00fcrecini h\u0131zla ilerletmektedir.\n\n## Ana Noktalar\n\n- Ara\u015ft\u0131rma metodolojisi\n- Akademik etik\n- Veri gizlili\u011fi\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-tandfonline-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 52}}, {"data": {"id": "references/bethlehem-tekola-on-emotion-in-research-738", "label": "Bethlehem Tekola on emotion in research", "type": "Article", "description": "Bethlehem Tekola, qualitative research ethics scholar, shares a powerful observation: 'emotion in research is not merely overlooked but actively suppressed by academic norms that privilege detachment ", "resource": "https://x.com/Bethlehemtekola/status/2056464280564727815", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://x.com/Bethlehemtekola/status/2056464280564727815...](https://x.com/Bethlehemtekola/status/2056464280564727815)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** None\n\n## \u00d6zet\n\nBethlehem Tekola, qualitative research ethics scholar, shares a powerful observation: 'emotion in research is not merely overlooked but actively suppressed by academic norms that privilege detachment and objectivity. These constraints not only shape how emotion is discussed but also how it is experienced and negotiated within academic life and research.' The post includes a visual elaborating on this theme. This critique speaks to the epistemic violence of traditional academic frameworks that marginalize affective dimensions of knowledge production, particularly relevant to research involving marginalised communities.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de akademik ara\u015ft\u0131rma k\u00fclt\u00fcr\u00fc, duygular\u0131n ara\u015ft\u0131rma s\u00fcrecindeki rol\u00fcn\u00fc genellikle g\u00f6z ard\u0131 etmekte ya da 'nesnellik' ad\u0131na bast\u0131rmaktad\u0131r. \u00d6zellikle sosyal bilimlerde, \u00f6zellikle de hassas topluluklarla (g\u00f6\u00e7menler, m\u00fclteciler, dezavantajl\u0131 gruplar) yap\u0131lan ara\u015ft\u0131rmalarda ara\u015ft\u0131rmac\u0131n\u0131n duygusal deneyimi sistematik olarak d\u0131\u015flanmaktad\u0131r. T\u00dcB\u0130TAK ve Y\u00d6K'\u00fcn etik kurul y\u00f6nergeleri, ara\u015ft\u0131rma s\u00fcrecinde duygusal g\u00fcvenlik ve ara\u015ft\u0131rmac\u0131 refah\u0131 konusunda s\u0131n\u0131rl\u0131 d\u00fczenleme i\u00e7ermektedir. Oysa T\u00fcrkiye'de m\u00fclteci \u00e7al\u0131\u015fmalar\u0131, toplumsal cinsiyet ara\u015ft\u0131rmalar\u0131 ve \u015fiddet \u00e7al\u0131\u015fmalar\u0131 gibi sahalarda ara\u015ft\u0131rmac\u0131lar yo\u011fun duygusal y\u00fck ta\u015f\u0131maktad\u0131r. Bu ba\u011flamda, Tekola'n\u0131n ele\u015ftirisi T\u00fcrkiye akademisi i\u00e7in de son derece ge\u00e7erlidir: Duygular\u0131 ara\u015ft\u0131rma d\u0131\u015f\u0131na itmek yerine, bunlar\u0131 metodolojik bir kaynak olarak g\u00f6ren yakla\u015f\u0131mlar\u0131n geli\u015ftirilmesi gerekmektedir.\n\n## Ana Noktalar\n\n- Akademik normlar duyguyu bast\u0131r\u0131yor\n- Nesnellik s\u00f6ylemi duygusal deneyimi d\u0131\u015fl\u0131yor\n- \u00d6zellikle hassas topluluk ara\u015ft\u0131rmalar\u0131nda ge\u00e7erli\n- T\u00fcrkiye'de ara\u015ft\u0131rmac\u0131 refah\u0131 ihmal ediliyor\n- Duyguyu metodolojik kaynak olarak g\u00f6rmek gerekli\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/x-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 40}}, {"data": {"id": "references/depolarization-toolkit-an-agentic-ai-framework-891", "label": "Depolarization Toolkit: An Agentic AI Framework", "type": "Article", "description": "The German Institute of Development and Sustainability (IDOS), in collaboration with the United Nations Development Programme (UNDP) and DW Akademie, is developing the Depolarization Toolkit \u2014 an AI-p", "resource": "https://www.idos-research.de/en/research/description/details/depolarization-toolkit-an-agentic-ai-framework/", "tags": ["KURATOR", "high", "yazarli"], "body": "**Kaynak:** [https://www.idos-research.de/en/research/description/details/depolarization-tool...](https://www.idos-research.de/en/research/description/details/depolarization-toolkit-an-agentic-ai-framework/)\n**Kategori:** KURATOR | **\u00d6ncelik:** high\n**Yazarlar:** Semuhi Sinanoglu, Armin von Schiller\n\n## \u00d6zet\n\nThe German Institute of Development and Sustainability (IDOS), in collaboration with the United Nations Development Programme (UNDP) and DW Akademie, is developing the Depolarization Toolkit \u2014 an AI-powered assistant built on a modular multi-agent architecture. Designed for development practitioners, media professionals, and public communicators, this conversational interface aims to generate adaptive, context-sensitive content to counter political and social polarization. The toolkit draws on a vetted knowledge repository and is publicly available to organizations and individuals for co-designing depolarization programming, capacity-building strategies, consulting processes, and training modules. What distinguishes this approach is its multi-agentic structure: the AI can reason about a user's specific context, produce structured outputs such as action plans and risk assessments for programming, and dynamically generate simulations and branching scenarios for capacity building and training. The project is ongoing in 2026 and is led by Semuhi Sinanoglu and Armin von Schiller at IDOS. Related publications by the team include work on reforming the development sector for agentic AI, how AI can help development organizations learn, and media support's need for a technology upgrade.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de siyasi kutupla\u015fma, \u00f6zellikle 2010'lu y\u0131llardan itibaren toplumsal ayr\u0131\u015fman\u0131n en kritik boyutlar\u0131ndan biri haline gelmi\u015ftir. Bu ba\u011flamda IDOS, UNDP ve DW Akademie i\u015fbirli\u011fiyle geli\u015ftirilen Depolarization Toolkit, T\u00fcrkiye'deki kutupla\u015fma kar\u015f\u0131t\u0131 \u00e7al\u0131\u015fmalar i\u00e7in \u00f6nemli bir model sunmaktad\u0131r. T\u00fcrkiye'de kutupla\u015fma ile m\u00fccadelede geleneksel olarak sivil toplum kurulu\u015flar\u0131, \u00fcniversiteler ve baz\u0131 kamu kurumlar\u0131 \u00e7e\u015fitli diyalog ve uzla\u015ft\u0131rma programlar\u0131 y\u00fcr\u00fctmektedir. Ancak bu \u00e7al\u0131\u015fmalar\u0131n \u00e7o\u011fu \u00f6l\u00e7eklenebilirlik sorunu ya\u015famakta ve belirli b\u00f6lgelerle s\u0131n\u0131rl\u0131 kalmaktad\u0131r. IDOS'un geli\u015ftirdi\u011fi \u00e7oklu-ajan yapay zeka mimarisi, bu \u00f6l\u00e7eklenebilirlik sorununa teknolojik bir \u00e7\u00f6z\u00fcm sunmaktad\u0131r. T\u00fcrkiye'de benzer bir yakla\u015f\u0131m\u0131n uygulanabilmesi i\u00e7in T\u00dcB\u0130TAK ve kalk\u0131nma ajanslar\u0131 b\u00fcnyesinde yapay zeka destekli kutupla\u015fma kar\u015f\u0131t\u0131 ara\u00e7lar\u0131n geli\u015ftirilmesi d\u00fc\u015f\u00fcn\u00fclebilir. \u00d6zellikle yerel se\u00e7im d\u00f6nemlerinde ve referandum s\u00fcre\u00e7lerinde artan kutupla\u015fma, bu t\u00fcr ara\u00e7lar\u0131n ihtiyac\u0131n\u0131 daha da belirgin k\u0131lmaktad\u0131r. RT\u00dcK ve BTK gibi d\u00fczenleyici kurumlar\u0131n medya ve ileti\u015fim politikalar\u0131 kapsam\u0131nda, yapay zeka destekli kutupla\u015fma izleme ve m\u00fcdahale ara\u00e7lar\u0131n\u0131 de\u011ferlendirmeleri faydal\u0131 olacakt\u0131r. Ayr\u0131ca, Avrupa Birli\u011fi'nin Dijital Hizmetler Yasas\u0131 (DSA) \u00e7er\u00e7evesinde platformlardan beklenen dezenformasyon ve kutupla\u015fma ile m\u00fccadele y\u00fck\u00fcml\u00fcl\u00fckleri, T\u00fcrkiye'nin uyum s\u00fcrecinde bu t\u00fcr yenilik\u00e7i ara\u00e7lar\u0131 dikkate almas\u0131n\u0131 gerektirmektedir. UNDP T\u00fcrkiye ofisinin bu alandaki potansiyel rol\u00fc de de\u011ferlendirilmelidir.\n\n## Ana Noktalar\n\n- IDOS, UNDP ve DW Akademie i\u015fbirli\u011fiyle depolarizasyon i\u00e7in yapay zeka destekli ara\u00e7 geli\u015ftiriliyor\n- \u00c7oklu-ajan (multi-agent) mimari ile ba\u011flama duyarl\u0131 i\u00e7erik \u00fcretimi hedefleniyor\n- Hedef kitle: kalk\u0131nma \u00e7al\u0131\u015fanlar\u0131, medya profesyonelleri ve kamu ileti\u015fimcileri\n- Eylem planlar\u0131, risk de\u011ferlendirmeleri, sim\u00fclasyonlar ve dallanan senaryolar \u00fcretebiliyor\n- Proje 2026'da devam ediyor ve kamuya a\u00e7\u0131k olarak sunulacak\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-idos-research-de) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 48}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-1-892", "label": "\u00c7ocuklar ve Dijital Ortam (1)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.digital-futures-for-children.net/events/child-rights-regulation", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://www.digital-futures-for-children.net/events/child-rights-regulation...](https://www.digital-futures-for-children.net/events/child-rights-regulation)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davran\u0131\u015flar, ya\u015f s\u0131n\u0131rlamalar\u0131, i\u00e7erik moderasyonu, siber zorbal\u0131k, dijital ba\u011f\u0131ml\u0131l\u0131k ve \u00e7ocuk psikolojisi ile teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-digital-futures-for-children-net) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-10-901", "label": "\u00c7ocuklar ve Dijital Ortam (10)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://5rights.org/reports/childrens-digital-rights-ai-2026", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://5rights.org/reports/childrens-digital-rights-ai-2026...](https://5rights.org/reports/childrens-digital-rights-ai-2026)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davran\u0131\u015flar, ya\u015f s\u0131n\u0131rlamalar\u0131, i\u00e7erik moderasyonu, siber zorbal\u0131k, dijital ba\u011f\u0131ml\u0131l\u0131k ve \u00e7ocuk psikolojisi ile teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131l \u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-commonsensemedia-org) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-12-903", "label": "\u00c7ocuklar ve Dijital Ortam (12)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.theguardian.com/technology/children-social-media", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://www.theguardian.com/technology/children-social-media...](https://www.theguar aktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-theguardian-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-13-904", "label": "\u00c7ocuklar ve Dijital Ortam (13)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.commonsensemedia.org/research/the-state-of-k kteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/5rightsfoundation-com le teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130 0e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-theguardian-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-19-910", "label": "\u00c7ocuklar ve Dijital Ortam (19)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.theguardian.com/technology/2025/jul/10/ai-generated-child-sexual-abuse-videos-surging-online-iwf", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://www.theguardian.com/technology/2025/jul/10/ai-generated-child-sexual-abu...](https://www.theguardian.com/technology/2025/j rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-theguardian-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-2-893", "label": "\u00c7ocuklar ve Dijital Ortam (2)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.lse.ac.uk/digital-future iye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-theguardian-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size":  yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n 0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk
