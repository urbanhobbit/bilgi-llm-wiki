akale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveyn n.com/greek-prime-minister-urges-eu-regulatory-action-againsalgorithmic-exploitation-of-children/)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davran\u0131\u015flar, ya\u015f s\u0131n\u0131rlamalar\u0131, i\u00e7erik moderasyonu, siber zorbal\u0131k, dijital ba\u011f\u0131ml\u0131l\u0131k ve \u00e7ocuk psikolojisi ile teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu er T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-theguardian-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-29-920", "label": "\u00c7ocuklar ve Dijital Ortam (29)", "type": "Article", "description": "Bu ka u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik 31l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-digital-futures-for-children-net) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-30-921", "label": "\u00c7ocuklar ve Dijital Ortam (30)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.bbc.com/future/article/20260317-how-kids-are-actually-using-ai", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://www.bbc.com/future/article/20260317-how-kids-are-actually-using-ai...](https://www.bbc.com/future/article/20260317-how-kids-are-actually-using-ai)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davran\u0131\u015flar, ya\u015f s\u0131n\u0131rlamalar\u0131, i\u00e7erik moderasyonu, siber zorbal\u0131k, dijital ba\u011f\u0131ml\u0131l\u0131k ve \u00e7ocuk psikolojisi ile teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130st kalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net 0fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/bianet-org) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-33-924", "label": "\u00c7ocuklar ve Dijital Ortam (33)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.cumhuriyet.com.tr/teknoloji/dijital-haklar-ve-secim-guvenligi-2143567", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://www.cumhuriyet.com.tr/teknoloji/dijital-haklar-ve-secim-guvenligi-214356...](https://www.cumhuriyet.com.tr/teknoloji/dijital-haklar-ve-secim-guvenligi-2143567)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler", "color": "#10b981", "size": 55}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-34-925", "label": "\u00c7ocuklar ve Dijital Ortam (34)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://bianet.org/bianet/dijital-guvenlik/265342-dijital-guvenligin-secim-surecindeki-onemi", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://bianet.org/bianet/dijital-guvenlik/265342-dijital-guvenligin-secim-surec...](https://bianet.org/bianet/dijital-guvenlik/265342-dijital-guvenligin-secim-surecindeki-onemi)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi v si kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/bianet-org) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-35-926", "label": "\u00c7ocuklar ve Dijital Ortam (35)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://tr.trust.org/item/turkey-youth-mental-health-report-2026", "tags": ["KURATOR", "medium", "yazarli"], "body": "**Kaynak:** [https://tr.trust.org/item/turkey-youth-mental-health-report-2026...](https://tr.trust.org/item/turkey-youth-mental-health-report-2026)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar: data/)\n**Kategori:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davran\u0131\u015flar, ya\u015f s\u0131n\u0131rlamalar\u0131, i\u00e7erik moderasyonu, siber zorbal\u0131k, dijital ba\u011f\u0131ml\u0131l\u0131k ve \u00e7ocuk psikolojisi ile teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0 alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-ftc-gov) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-38-929", "label": "\u00c7ocuklar ve Dijital Ortam (38)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u013 011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-theguardian-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-39-930", "label": "\u00c7ocuklar ve Dijital Ortam (39)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131 T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-theguardian-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981",  verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform d\u00fczenlemeleri\n- Ebeveynlik uygulamalar\u0131\n\n## Kaynak\n\n\u0130\u00e7erik [bu kaynaktan](/entities/www-reuters-com) al\u0131nm\u0131\u015ft\u0131r.", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-41-932", "label": "\u00c7ocuklar ve Dijital Ortam (41)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://techcrunch.com/2026/04/08/social-media-ban-children-countries-list/", "tags": ["KURATOR", "high", "yazarli"], "body": "**Kaynak:** [https://techcrunch.com/2026/04/08/social-media-ban-children-countries-list/...](https://techcrunch.com/2026/04/08/social-media-ban-children-countries-list/)\n**Kategori:** KURATOR | **\u00d6ncelik:** high\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davran\u0131\u015flar, ya\u015f s\u0131n\u0131rlamalar\u0131, i\u00e7erik moderasyonu, siber zorbal\u0131k, dijital ba\u011f\u0131ml\u0131l\u0131k ve \u00e7ocuk psikolojisi ile teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital ok 00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak yakla\u015fm\u0131\u015ft\u0131r. \u00d6zellikle Kahramanmara\u015f ve \u015eanl\u0131urfa'da 2026 y\u0131l\u0131n\u0131n Nisan ay\u0131nda ya\u015fanan okul sald\u0131r\u0131lar\u0131, toplumsal fark\u0131ndal\u0131\u011f\u0131 art\u0131rm\u0131\u015f ve \u00e7ocuklar\u0131n sosyal medya \u00fczerinden tehdit i\u00e7erikleri payla\u015fmas\u0131yla ilgili soru\u015fturmalar\u0131n say\u0131s\u0131n\u0131 h\u0131zla art\u0131rm\u0131\u015ft\u0131r. Emniyet Genel M\u00fcd\u00fcrl\u00fc\u011f\u00fc Siber Su\u00e7lar \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar 15eube M\u00fcd\u00fcrl\u00fc\u011f\u00fc, bu sald\u0131r\u0131lar sonras\u0131nda sanal devriye faaliyetlerini g\u00fc\u00e7lendirerek, Telegram, WhatsApp, Instagram ve di\u011fer mesajla\u015fma platformlar\u0131nda \u00e7ocuklar\u0131 hedef alan sak\u0131ncal\u0131 i\u00e7eriklere y\u00f6nelik tespit ve operasyonlar\u0131 yo\u011funla\u015ft\u0131rm\u0131\u015ft\u0131r. \u0130stanbul, Ankara, \u0130zmir ve \u015eanl\u0131urfa'da siber su\u00e7larla m\u00fccadele ekipleri, 18 ya\u015f\u0131ndan k\u00fc\u00e7\u00fck \u015f\u00fcphelilere y\u00f6nelik soru\u015fturmalar ba\u015flatm\u0131\u015f ve baz\u0131 durumlarda tutuklamalara gidilmi\u015ftir.\n\nT\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda korunmas\u0131 i\u00e7in yasal \u00e7er\u00e7eve KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) 6698 say\u0131s\u0131 ile olu\u015fturulmu\u015ftur. Ancak 2024-2026 d\u00f6neminde, Avrupa Birli\u011fi Dijital Hizmetler Yasas\u0131 (DSA) ve Dijital \u0130\u00e7erikler Yasas\u0131 (Age-Appropriate Design Code) gibi uluslararas\u0131 d\u00fczenlemeler T\u00fcrkiye i\u00e7in de referans noktas\u0131 olu\u015fturmu\u015f ve TBMM'de ilgili yasa tasar\u0131lar\u0131 g\u00f6r\u00fc\u015f\u00fclmeye ba\u015flanm\u0131\u015ft\u0131r. BTK (Bilgi Teknolojileri ve \u0130leti\u015fim Kurumu), 18 ya\u015f alt\u0131 kullan\u0131c\u0131lar i\u00e7in zorunlu i\u00e7erik filtreleme sistemleri ve ya\u015f do\u011frulama mekanizmalar\u0131 uygulamay\u0131 zorunlu k\u0131lm\u0131\u015ft\u0131r. T\u00fcrk Telekom, T\u00fcrk Telekom Ailesi, Superonline ve Avea gibi internet servis sa\u011flay\u0131c\u0131lar\u0131, ebeveyn kontrol yaz\u0131l\u0131mlar\u0131 ve \u00e7ocuk modu gibi g\u00fcvenlik \u00f6zelliklerini pakette sunmaya ba\u015flam\u0131\u015ft\u0131r.\n\nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler", "color": "#10b981", "size": 55}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-45-936", "label": "\u00c7ocuklar ve Dijital Ortam (45)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.ack.net/education/reps-pass-youth-social-media-ban-over-privacy-big-tech-concerns/article5a0029f0-0ed8-4730-8222-017ca1f1c10e.html", "tags": ["KURATOR", "high", "yazarli"], "body": "**Kaynak:** [https://www.ack.net/education/reps-pass-youth-social-media-ban-over-privacy-big-...](https://www.ack.net/education/reps-pass-youth-social-media-ban-over-privacy-big-tech-concerns/article5a0029f0-0ed8-4730-8222-017ca1f1c10e.html)\n**Kategori:** KURATOR | **\u00d6ncelik:** high\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130 nMill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, 2024 y\u0131l\u0131nda 'Dijital Vatanda\u015fl\u0131k ve G\u00fcvenli \u0130nternet Kullan\u0131m\u0131' m\u00fcfredat program\u0131n\u0131 t\u00fcm okullara entegre etmi\u015ftir. \u0130lkokul, ortaokul ve lise seviyelerinde \u00f6\u011frencilere, dijital okuryazarl\u0131k, siber zorbal\u0131kla m\u00fccadele, mahremiyet bilinci ve g\u00fcvenli sosyal medya kullan\u0131m\u0131 konular\u0131nda e\u011fitimler verilmektedir. EBA (E\u011fitim Bili\u015fim A\u011f\u0131) \u00fczerinden \u00e7ocuklar ve ebeveynler i\u00e7in dijital g\u00fcvenlik e\u011fitim videolar\u0131 yay\u0131nlanm\u0131\u015ft\u0131r. Ayr\u0131ca, 'Okul \u00d6ncesi Dijital E\u011fitim' program\u0131 ile en k\u00fc\u00e7\u00fck \u00e7ocuklara teknoloji kullan\u0131m\u0131 konusunda y\u00f6nlendirici bilgiler verilmektedir.\n\nT\u00fcrkiye'deki sivil toplum kurulu\u015flar\u0131 da bu konuda aktif rol oynamaktad\u0131r. \u00c7OCUK VAKFI, UNICEF T\u00fcrkiye Temsilcili\u011fi, T\u00fcrkiye \u00c7ocuk Haklar\u0131 Komisyonu ve Aile ve \u00c7ocuk Ara\u015ft\u0131rmalar\u0131 Derne\u011fi, \u00e7ocuklar\u0131n dijital haklar\u0131 ve \u00e7evrimi\u00e7i g\u00fcvenli\u011fi konusunda kampanyalar d\u00fczenlemekte, seminerler organize etmekte ve e\u011fitim programlar\u0131 sunmaktad\u0131r. 'Dijital Ebeveynlik' seminerleri, belediyeler arac\u0131l\u0131\u011f\u0131yla t\u00fcm b\u00fcy\u00fck\u015fehirlerde d\u00fczenlenmekte ve ebeveynlere \u00e7ocuklar\u0131n\u0131n ekran s\u00fcresini y\u00f6netme, dijital i\u00e7erik moderasyonu ve ya\u015fa uygun platform se\u00e7imi konular\u0131nda rehberlik sa\u011flanmaktad\u0131r.\n\nAvrupa Birli\u011fi'ne \u00fcyelik s\u00fcreci kapsam\u0131nda, T\u00fcrkiye'nin dijital hukuk uyum \u00e7al\u0131\u015fmalar\u0131 da h\u0131z kazanm\u0131\u015ft\u0131r. 2025 y\u0131l\u0131nda T\u00fcrkiye Dijital D\u00f6n\u00fc\u015f\u00fcm Ofisi kurularak, \u00e7ocuk koruma politikalar\u0131 ve dijital g\u00fcvenlik standartlar\u0131 uluslararas\u0131 normlarla uyumlu hale getirilmeye \u00e7al\u0131\u015f\u0131lmaktad\u0131r. Ancak mevcut yakla\u015f\u0131mda, Avustralya veya Yunanistan'daki gibi a\u00e7\u0131k sosyal medya yasaklar\u0131 yerine, e\u011fitici, denetleyici ve \u00f6nleyici \u00f6nlemler \u00f6ne \u00e7\u0131kmaktad\u0131r. Ebeveynlerin dijital ebeveynlik uygulamalar\u0131 (Qustodio, Net Nanny, Screen Time) kullan\u0131m\u0131 giderek artmakta ve teknoloji \u015firketleri, T\u00fcrkiye pazar\u0131na \u00f6zel \u00e7ocuk koruma mod\u00fclleri geli\u015ftirmektedir. Sonu\u00e7 olarak, T\u00fcrkiye'de \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusunda hem yasal hem de e\u011fitici \u00f6nlemler \u00e7ok y\u00f6nl\u00fc bir yakla\u015f\u0131m sunmaktad\u0131r ve bu alandaki \u00e7al\u0131\u015fmalar 2026 y\u0131l\u0131nda da h\u0131zla devam etmektedir.\n\n## Ana Noktalar\n\n- \u00c7ocuk dijital g\u00fcvenli\u011fi\n- Platform politikalar\u0131\n- D\u00fczenleyici \u00f6nlemler", "color": "#10b981", "size": 56}}, {"data": {"id": "references/ocuklar-ve-dijital-ortam-46-937", "label": "\u00c7ocuklar ve Dijital Ortam (46)", "type": "Article", "description": "Bu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davr", "resource": "https://www.wgbh.org/news/politics/2026-04-08/mass-house-passes-bill-to-ban-kids-under-14-from-social-media", "tags": ["KURATOR", "high", "yazarli"], "body": "**Kaynak:** [https://www.wgbh.org/news/politics/2026-04-08/mass-house-passes-bill-to-ban-kids...](https://www.wgbh.org/news/politics/2026-04-08/mass-house-passes-bill-to-ban-kids-under-14-from-social-media)\n**Kategori:** KURATOR | **\u00d6ncelik:** high\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, i:** KURATOR | **\u00d6ncelik:** medium\n**Yazarlar:** \n\n## \u00d6zet\n\nBu kaynak, \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi, sosyal medya kullan\u0131m\u0131, ekran s\u00fcresi y\u00f6netimi ve platform politikalar\u0131 hakk\u0131nda kapsaml\u0131 bilgi sunmaktad\u0131r. \u0130\u00e7erik, dijital vatanda\u015fl\u0131k, \u00e7evrimi\u00e7i davran\u0131\u015flar, ya\u015f s\u0131n\u0131rlamalar\u0131, i\u00e7erik moderasyonu, siber zorbal\u0131k, dijital ba\u011f\u0131ml\u0131l\u0131k ve \u00e7ocuk psikolojisi ile teknoloji aras\u0131ndaki ili\u015fkinin detayl\u0131 analizini i\u00e7ermektedir. Makale, farkl\u0131 \u00fclkelerin \u00e7ocuk koruma politikalar\u0131n\u0131 kar\u015f\u0131la\u015ft\u0131rmal\u0131 olarak inceleyerek, d\u00fczenleyici \u00f6nlemler, ebeveynlik uygulamalar\u0131 ve teknoloji \u015firketlerinin sorumluluklar\u0131 hakk\u0131nda \u00f6neriler sunmaktad\u0131r. Ayr\u0131ca, dijital okuryazarl\u0131k e\u011fitimi, ya\u015fa uygun teknoloji kullan\u0131m\u0131 ve \u00e7ocuklar\u0131n online deneyimlerinin optimize edilmesi konusunda pratik tavsiyeler ve ara\u015ft\u0131rma bulgular\u0131na dayal\u0131 sonu\u00e7lar sunulmaktad\u0131r. Kaynak, akademik ara\u015ft\u0131rmalar, anket verileri ve uzman g\u00f6r\u00fc\u015flerini sentezleyerek, \u00e7ocuklar\u0131n dijital d\u00fcnyadaki mevcut durumunu ve gelecekteki e\u011filimleri \u00f6ng\u00f6rmektedir.\n\n## T\u00fcrkiye Ba\u011flam\u0131\n\nT\u00fcrkiye'de \u00e7ocuk dijital g\u00fcvenli\u011fi konusu son y\u0131llarda \u00f6nemli bir kamuoyu tart\u0131\u015fmas\u0131 haline gelmi\u015ftir. 2025-2026 d\u00f6neminde, T\u00fcrkiye Cumhuriyeti \u0130\u00e7i\u015fleri Bakanl\u0131\u011f\u0131, Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131, Aile ve Sosyal Hizmetler Bakanl\u0131\u011f\u0131 ve Bilim, Teknoloji ve Y\u00fcksek\u00f6\u011fretim Kurulu (Y\u00d6K), \u00e7ocuklar\u0131n dijital ortamda g\u00fcvenli\u011fi konusuna \u00f6ncelikli odak noktalar\u0131ndan biri olarak
