#cy { width:100vw; height:100vh; }

#controls label { font-size:13px; color:#94a3b8; }

#legend .dot { width:12px; height:12px; border-radius:50%; }

#detail p { font-size:13px; color:#94a3b8; line-height:1.4; }
#detail a { color:#8b5cf6; text-decoration:none; }
#detail a:hover { text-decoration:underline; }
#checkbox-bar { position:fixed; top:76px; left:50%; transform:translateX(-50%); z-index:100; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; background:rgba(15,23,42,0.8); backdrop-filter:blur(8px); padding:8px 16px; border-radius:10px; border:1px solid #334155; }
.checkbox-item { display:flex; align-items:center; gap:5px; font-size:12px; cursor:pointer; }
.checkbox-item input { cursor:pointer; }
.checkbox-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

        data: { ...n, color: COLORS[n.type] || '#94a3b8' }
      })),
      ...filteredEdges.map(e => ({
        data: { source: e.src, target: e.tgt, label: e.label }
      }))
    ],
    layout: { name: layoutName === 'cola' ? 'grid' : layoutName },
    wheelSensitivity: 0.3,
  });

  if (layoutName === 'cola') {
    // fallback: use concentric centered on edmo
    cy.layout({ name: 'concentric', concentric: el => el.id() === 'edmo' ? 0 : 1, levelWidth: () => 1 }).run();
  }
  
  cy.on('tap', 'node', function(evt) {
    const n = evt.target.data();
    const d = document.getElementById('detail');
    d.style.display = 'block';
    let html = `<h3>${n.label.replace(/\n/g, '<br>')}</h3>`;
    html += `<p style="color:#${COLORS[n.type]?.slice(1) || '94a3b8'};font-size:11px;text-transform:uppercase">${n.type}</p>`;
    if (n.desc) html += `<p style="margin-top:6px">${n.desc}</p>`;
    if (n.date) html += `<p style="margin-top:4px;font-size:12px;color:#64748b">📅 ${n.date}</p>`;
    if (n.url) html += `<p style="margin-top:6px"><a href="${n.url}" target="_blank">🔗 Source</a></p>`;
    d.innerHTML = html;
  });
  
  cy.on('tap', function(evt) {
    if (evt.target === cy) document.getElementById('detail').style.display = 'none';
  });
  
  updateStats(filtered.length, filteredEdges.length);
}

function updateStats(n, e) {
  document.getElementById('stats').textContent = `${n} nodes · ${e} edges · ${nodes.length} total`;
}

// ── Type checkboxes ──
const typeInfo = [
  { key: 'institution', label: 'Institution', color: '#8b5cf6' },
  { key: 'hub', label: 'Hubs', color: '#6366f1' },
  { key: 'concept', label: 'Concepts', color: '#a855f7' },
  { key: 'weekly-pulse', label: 'Weekly Pulse', color: '#10b981' },
  { key: 'signals-noise', label: 'Signals & Noise', color: '#14b8a6' },
];
const activeTypes = new Set(typeInfo.map(t => t.key));

const bar = document.getElementById('checkbox-bar');
typeInfo.forEach(ti => {
  const div = document.createElement('div');
  div.className = 'checkbox-item';
  div.innerHTML = `<input type="checkbox" checked><span class="checkbox-dot" style="background:${ti.color}"></span>${ti.label}`;
  div.querySelector('input').addEventListener('change', function() {
    if (this.checked) activeTypes.add(ti.key);
    else activeTypes.delete(ti.key);
    const layout = document.getElementById('layout-select').value;
    initCy(layout, Array.from(activeTypes));
  });
  bar.appendChild(div);
});

// ── Layout switcher ──
document.getElementById('layout-select').addEventListener('change', function() {
  initCy(this.value, Array.from(activeTypes));
});

document.getElementById('reset-btn').addEventListener('click', function() {
  cy.fit(undefined, 50);
  cy.center();
});

let labelsVisible = true;
document.getElementById('toggle-labels').addEventListener('click', function() {
  labelsVisible = !labelsVisible;
  cy.nodes().style('label', labelsVisible ? 'data(label)' : '');
  this.textContent = labelsVisible ? '◉ Toggle Labels' : '◯ Toggle Labels';
});

// ── Init ──
initCy('concentric', Array.from(activeTypes));
</script>
</body>
